<div class="add-cards-page" *transloco="let t">
  <navigation-bar>
    <button class="btn-ghost" (click)="cancel()">✕ {{ t('common.cancel') }}</button>
    <span class="nav-title-centered">{{ t('pattern.questionsPageTitle') }}</span>
  </navigation-bar>

  <main class="add-cards-content">
    @if (loading()) {
      <p class="state-muted">{{ t('common.loading') }}</p>
    } @else {
      <section class="questions-panel">
        <div class="questions-header">
          <h2>{{ t('pattern.questionsHeading') }}</h2>
          <button type="button" class="btn-secondary" (click)="addQuestion()">＋ {{ t('pattern.addQuestionButton') }}</button>
        </div>

        @for (card of cards(); track card.id; let i = $index) {
          <div class="question-row" [class.question-row--selected]="card.id === selectedId()"
               (click)="selectCard(card.id)">
            <span class="question-number">{{ card.order }}</span>
            <input class="form-input question-text"
                   [value]="card.text"
                   (input)="setText(card.id, $any($event.target).value)"
                   maxlength="1000"
                   [placeholder]="t('pattern.questionTextPlaceholder')" />
            <div class="question-actions">
              <button type="button" (click)="moveUp(i); $event.stopPropagation()" [disabled]="i === 0" [attr.aria-label]="t('pattern.moveUpLabel')">▲</button>
              <button type="button" (click)="moveDown(i); $event.stopPropagation()" [disabled]="i === cards().length - 1" [attr.aria-label]="t('pattern.moveDownLabel')">▼</button>
              <button type="button" class="remove" (click)="removeQuestion(card.id); $event.stopPropagation()" [attr.aria-label]="t('pattern.removeLabel')">✕</button>
            </div>
          </div>
        } @empty {
          <p class="state-muted">{{ t('pattern.noQuestionsAddOne') }}</p>
        }
      </section>

      <section class="table-panel">
        <add-pattern-table
          [cards]="cards()"
          [cardSizePercent]="cardSizePercent()"
          [tableHeightPercent]="tableHeightPercent()"
          [selectedId]="selectedId()"
          (cardSelect)="selectCard($event)"
          (cardMove)="movePatternCard($event)"
          (cardRotate)="rotatePatternCard($event)"
          (cardSizeChange)="onCardSizeChange($event)"
          (tableHeightChange)="onTableHeightChange($event)"
        ></add-pattern-table>
      </section>

      @if (error()) { <div class="state-error">{{ error() }}</div> }

      <button type="button" class="btn-primary btn-full" [disabled]="saving()" (click)="save()">
        {{ saving() ? t('pattern.saving') : ('💾 ' + t('pattern.savePatternButton')) }}
      </button>
    }
  </main>
</div>
