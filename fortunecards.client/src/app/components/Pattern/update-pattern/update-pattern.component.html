<div class="form-page">
  <navigation-bar>
    <button class="btn-ghost" (click)="cancel()">✕ Cancel</button>
    <span class="nav-title-centered">Edit Pattern</span>
  </navigation-bar>

  <main class="form-content">
    <form (ngSubmit)="submit()" [formGroup]="form" *ngIf="!loading()">
      <div class="emoji-section">
        <div class="emoji-preview" [style.background]="getSelectedGradient()">
          <input class="emoji-input" formControlName="emoji" maxlength="10" placeholder="🔮" aria-label="Pattern emoji" />
        </div>
        <p class="emoji-hint">Type or paste an emoji</p>
      </div>

      <div class="form-field">
        <label class="form-label">Color</label>
        <div class="swatch-row">
          <button type="button" class="color-swatch" *ngFor="let i of GRADIENTS"
                  [style.background]="getGradientStyle(i)"
                  [class.swatch--selected]="form.get('colorIndex')!.value === i"
                  (click)="selectColor(i)"></button>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label">Visibility</label>
        <div class="visibility-row">
          <button type="button" class="visibility-btn"
                  [class.visibility-btn--active]="!form.get('isPublic')!.value"
                  (click)="form.get('isPublic')!.setValue(false)">🔒 Private</button>
          <button type="button" class="visibility-btn"
                  [class.visibility-btn--active]="form.get('isPublic')!.value"
                  (click)="form.get('isPublic')!.setValue(true)">🌐 Public</button>
        </div>
      </div>

      <div class="form-field">
        <label class="form-label" for="patternName">Pattern Name</label>
        <input id="patternName" class="form-input" formControlName="name" maxlength="200" />
      </div>

      <div class="form-field">
        <label class="form-label" for="patternDesc">Description <span>(optional)</span></label>
        <textarea id="patternDesc" class="form-textarea" formControlName="description" maxlength="1000" rows="3"></textarea>
      </div>

      <div *ngIf="error()" class="state-error">{{ error() }}</div>

      <button type="button" class="btn-secondary btn-full" (click)="editQuestions()">✏️ Edit questions & layout</button>

      <button type="submit" class="btn-primary btn-full" [disabled]="form.invalid || submitting()">
        {{ submitting() ? 'Saving…' : '💾 Save' }}
      </button>

      <button type="button" class="btn-danger btn-full" [disabled]="deleting()" (click)="deletePattern()">
        {{ deleting() ? 'Deleting…' : '🗑 Delete pattern' }}
      </button>
    </form>
  </main>
</div>
