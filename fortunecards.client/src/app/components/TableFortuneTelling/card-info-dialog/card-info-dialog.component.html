<ng-container *transloco="let t">
  <div class="dialog-backdrop" (click)="closed.emit()"></div>
  <div class="dialog-panel" role="dialog" [attr.aria-label]="t('table.cardInfoAriaLabel')">
    <div class="card-info-body">
      <img class="card-info-img" [src]="imageUrl()" alt=""
           [style.aspect-ratio]="aspectWidth() + ' / ' + aspectHeight()" />
      <div class="card-info-text">
        <h2 class="card-info-title">{{ title() }}</h2>
        <p class="card-info-description">{{ description() }}</p>
      </div>
    </div>
    <button class="dialog-close" type="button" (click)="closed.emit()">{{ t('common.close') }}</button>
  </div>
</ng-container>
