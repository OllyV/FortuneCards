<div class="dialog-backdrop" (click)="closed.emit()"></div>
<div class="dialog-panel" role="dialog" [attr.aria-label]="t('table.settingsTitle')" *transloco="let t">
  <h2>{{ t('table.settingsTitle') }}</h2>

  <div class="setting">
    <span class="setting-label">{{ t('table.colorOfTableLabel') }}</span>
    <div class="swatches">
      @for (c of colors; track c) {
        <button
          type="button"
          class="swatch"
          [attr.data-color]="c"
          [class.active]="color() === c"
          [attr.aria-label]="t('table.color.' + c)"
          (click)="colorChange.emit(c)"
        ></button>
      }
    </div>
  </div>

  <div class="setting">
    <label class="setting-label" for="card-size">{{ t('table.cardSizeLabel', { n: cardSize() }) }}</label>
    <input id="card-size" type="range" min="5" max="50" [value]="cardSize()" (input)="onSizeInput($event)" />
  </div>

  <button class="dialog-close" type="button" (click)="closed.emit()">{{ t('common.close') }}</button>
</div>
