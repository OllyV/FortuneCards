<ng-container *transloco="let t">
  <div class="page" *ngIf="!loading() && !error()">
    <navigation-bar>
      <button class="nav-back" (click)="backToDeck()">← {{ deck()?.name }}</button>
      <span class="nav-title-centered">{{ t('card.drawTitle') }}</span>
      <span></span>
    </navigation-bar>

    <main class="draw-scene" *ngIf="drawnCard() as card">
      <p class="draw-hint" [class.hint-hidden]="flipped()">✨ {{ t('card.tapHint') }}</p>

      <div class="card-scene"
           [class.flipped]="flipped()"
           [style.aspect-ratio]="(deck()?.aspectWidth ?? 3) + ' / ' + (deck()?.aspectHeight ?? 5)"
           (click)="flipCard()">
        <div class="card-flipper">
          <!-- Back (face-down) -->
          <div class="card-back">
            <img *ngIf="hasCustomBack()"
                 [src]="getCardBackImageUrl()"
                 class="card-back-img"
                 [alt]="t('card.backAlt')" />
            <div *ngIf="!hasCustomBack()"
                 class="card-back-gradient"
                 [style.background]="getCardBackGradient()">
              <div class="card-back-inner">
                <span class="card-back-emoji">🎴</span>
              </div>
            </div>
            <span class="card-back-label">{{ t('card.tapToReveal') }}</span>
          </div>

          <!-- Face (revealed) -->

          <div class="card-face">
            <div class="card-face-image">
              <img *ngIf="card.imageUrl" [src]="card.imageUrl" [alt]="card.title" />
              <span *ngIf="!card.imageUrl" class="card-face-placeholder">🃏</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card-detail" *ngIf="flipped()">
        <h1 class="card-detail-title">{{ card.title }}</h1>
        <p class="card-detail-desc">{{ card.description }}</p>
      </div>

      <div class="draw-actions" [class.actions-visible]="flipped()">
        <button class="btn-primary" (click)="drawAnother()">🎴 {{ t('card.drawAnother') }}</button>
        <button class="btn-secondary" (click)="backToDeck()">← {{ t('card.backToDeck') }}</button>
      </div>
    </main>
  </div>

  <div *ngIf="loading()" class="state-loading">{{ t('card.loadingDeck') }}</div>
  <div *ngIf="error()" class="state-error">{{ error() }}</div>
</ng-container>
