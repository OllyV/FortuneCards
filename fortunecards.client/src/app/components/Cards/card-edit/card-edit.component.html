<div class="form-page" *transloco="let t">
  <navigation-bar>
    <button class="btn-ghost" (click)="cancel()">✕ {{ t('common.cancel') }}</button>
    <span class="nav-title-centered">{{ t('card.editCard') }}</span>
  </navigation-bar>

  <main class="form-content">
    <form (ngSubmit)="submit()" [formGroup]="form">

      <!-- Card image -->
      <div class="form-field image-field">
        <label class="form-label">{{ t('card.imageLabel') }}</label>
        <div class="image-upload-area" [class.has-image]="imagePreview() || currentImageUrl()"
             [style.aspect-ratio]="aspectRatio()">
          <img *ngIf="imagePreview()" [src]="imagePreview()" class="image-preview" [alt]="t('card.imagePreviewAlt')" />
          <img *ngIf="!imagePreview() && currentImageUrl()" [src]="currentImageUrl()!" class="image-preview" [alt]="t('card.currentImageAlt')" />
          <div *ngIf="!imagePreview() && !currentImageUrl()" class="image-placeholder">
            <span class="image-placeholder-icon">🖼️</span>
            <p class="image-placeholder-text">{{ t('card.uploadHint') }}</p>
          </div>
          <label class="image-replace btn-secondary btn-file">
            {{ (imagePreview() || currentImageUrl()) ? t('card.replace') : t('card.upload') }}
            <input type="file" accept="image/*" (change)="onImageSelected($event)" hidden />
          </label>
          <button type="button" class="image-remove" *ngIf="imagePreview()" (click)="removeImage()">✕</button>
        </div>
      </div>

      <!-- Title -->
      <div class="form-field">
        <label class="form-label" for="cardTitle">{{ t('card.titleLabel') }}</label>
        <input
          id="cardTitle"
          class="form-input"
          formControlName="title"
          [placeholder]="t('card.titlePlaceholder')"
          maxlength="200"
        />
      </div>

      <!-- Description -->
      <div class="form-field">
        <label class="form-label" for="cardDesc">{{ t('card.descriptionLabel') }}</label>
        <textarea
          id="cardDesc"
          class="form-textarea"
          formControlName="description"
          [placeholder]="t('card.descriptionPlaceholder')"
          maxlength="2000"
          rows="4"
        ></textarea>
      </div>

      <div *ngIf="error()" class="state-error">{{ error() }}</div>

      <button type="submit" class="btn-primary btn-full" [disabled]="form.invalid || submitting()">
        {{ submitting() ? t('card.saving') : ('💾 ' + t('card.saveChanges')) }}
      </button>

      <button type="button" class="btn-danger btn-full" [disabled]="deleting()" (click)="deleteCard()">
        {{ deleting() ? t('card.deleting') : ('🗑 ' + t('card.deleteButton')) }}
      </button>
    </form>
  </main>
</div>
