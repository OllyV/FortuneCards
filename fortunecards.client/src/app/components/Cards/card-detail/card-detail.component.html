<div class="page" *transloco="let t">
  <navigation-bar>
    <div class="nav-actions">
      <button class="nav-back" (click)="goBack()">← {{ t('card.backLink') }}</button>
    </div>
  </navigation-bar>

  <main class="page-content">
    <div *ngIf="card() as c; else notFoundOrLoading" class="card-detail">
      <div class="card-figure"
           [style.aspect-ratio]="(deck()?.aspectWidth ?? 3) + ' / ' + (deck()?.aspectHeight ?? 5)">
        <img *ngIf="c.imageUrl" [src]="c.imageUrl" [alt]="c.title" />
        <span *ngIf="!c.imageUrl" class="card-figure-placeholder">🃏</span>
      </div>
      <h1 class="card-detail-title">{{ c.title }}</h1>
      <p class="card-detail-desc">{{ c.description }}</p>

      <div *ngIf="isOwner()" class="card-actions">
        <button type="button" class="btn-primary" (click)="editCard()">✏️ {{ t('card.editCard') }}</button>
        <button type="button" class="btn-danger" [disabled]="deleting()" (click)="deleteCard()">
          {{ deleting() ? t('card.deleting') : ('🗑 ' + t('card.deleteButton')) }}
        </button>
      </div>
      <div *ngIf="error()" class="state-error">{{ error() }}</div>

    </div>

    <ng-template #notFoundOrLoading>
      <div *ngIf="loading()" class="state-loading">{{ t('card.loadingCard') }}</div>
      <div *ngIf="!loading() && error()" class="state-error">{{ error() }}</div>
      <div *ngIf="!loading() && !error()" class="state-error">{{ t('errors.cardNotFound') }}</div>
    </ng-template>
  </main>
</div>
