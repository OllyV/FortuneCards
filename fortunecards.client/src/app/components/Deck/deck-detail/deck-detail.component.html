<ng-container *transloco="let t">
  <div class="page" *ngIf="deck() as d; else loadingOrError">
    <navigation-bar>
      <div class="nav-actions">
        <button class="nav-back" (click)="goBack()">← {{ t('common.back') }}</button>
        <span class="nav-sep">/</span>
        <span class="nav-crumb">{{ d.name }}</span>
      </div>
    </navigation-bar>

    <app-deck-hero
      [name]="d.name"
      [emoji]="d.emoji"
      [description]="d.description"
      [cardCount]="(d.cards ?? []).length"
      [colorIndex]="d.colorIndex"
      [isOwner]="d.isOwner"
      [isFavorite]="d.isFavorite"
      [isLoggedIn]="auth.isLoggedIn()"
      (drawCard)="drawCard()"
      (editDeck)="editDeck()"
      (addCard)="addCard()"
      (toggleFavorite)="toggleFavorite()"
    ></app-deck-hero>

    <main class="page-content">
      <h2 class="section-title">{{ t('deck.cardsInDeck') }}</h2>

      <div class="card-grid">
        <div *ngIf="d.isOwner" class="card-tile card-tile--add"
             [style.aspect-ratio]="d.aspectWidth + ' / ' + d.aspectHeight"
             (click)="addCard()">
          <div class="card-image card-image--add">+</div>
        </div>

        <div class="card-tile"
             *ngFor="let card of (d.cards ?? []); let i = index"
             [style.aspect-ratio]="d.aspectWidth + ' / ' + d.aspectHeight"
             [style.border-top-color]="getCardAccent(i)"
             (click)="openCard(card.id)">
          <div class="card-image" [style.background]="getCardAccent(i) + '18'">
            <img *ngIf="card.imageUrl" [src]="card.imageUrl" [alt]="card.title" loading="lazy" decoding="async" />
            <span *ngIf="!card.imageUrl" class="card-placeholder">🃏</span>
          </div>
          <div class="card-body">
            <p class="card-title">{{ card.title }}</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <ng-template #loadingOrError>
    <app-skeleton-detail *ngIf="loading()" />
    <app-error-state *ngIf="error()" [message]="error()!" (retry)="retry()" />
  </ng-template>
</ng-container>
