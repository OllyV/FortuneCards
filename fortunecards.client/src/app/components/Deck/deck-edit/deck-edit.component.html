<div class="form-page" *transloco="let t">
  <navigation-bar>
    <button class="btn-ghost" (click)="cancel()">✕ {{ t('common.cancel') }}</button>
    <span class="nav-title-centered">{{ t('deck.editTitle') }}</span>
  </navigation-bar>

  <main class="form-content">
    <form (ngSubmit)="submit()" [formGroup]="form">

      <!-- Emoji input -->
      <div class="emoji-section">
        <div class="emoji-preview" [style.background]="getSelectedGradient()">
          <input class="emoji-input"
                 formControlName="emoji"
                 maxlength="10"
                 placeholder="🎴"
                 [attr.aria-label]="t('deck.emojiAriaLabel')" />
        </div>
        <p class="emoji-hint">{{ t('deck.emojiHint') }}</p>
      </div>

      <!-- Color swatches -->
      <div class="form-field">
        <label class="form-label">{{ t('deck.colorLabel') }}</label>
        <div class="swatch-row">
          <button type="button"
                  class="color-swatch"
                  *ngFor="let i of GRADIENTS"
                  [style.background]="getGradientStyle(i)"
                  [class.swatch--selected]="form.get('colorIndex')!.value === i"
                  (click)="selectColor(i)"></button>
        </div>
      </div>

      <!-- Card shape / aspect ratio -->
      <div class="form-field">
        <label class="form-label">{{ t('deck.aspectLabel') }}</label>
        <div class="aspect-row">
          <input class="form-input aspect-input" type="number" min="1" max="100" step="1"
                 formControlName="aspectWidth" [attr.aria-label]="t('deck.aspectWidthAriaLabel')" />
          <span class="aspect-colon">:</span>
          <input class="form-input aspect-input" type="number" min="1" max="100" step="1"
                 formControlName="aspectHeight" [attr.aria-label]="t('deck.aspectHeightAriaLabel')" />
          <div class="aspect-preview"
               [style.aspect-ratio]="(form.get('aspectWidth')!.value || 3) + ' / ' + (form.get('aspectHeight')!.value || 5)"
               [style.background]="getSelectedGradient()"></div>
        </div>
      </div>

      <!-- Card back upload -->
      <div class="form-field">
        <label class="form-label">{{ t('deck.cardBackLabel') }} <span>{{ t('deck.optionalLabel') }}</span></label>
        <div class="card-back-row">
          <div class="card-back-preview">
            <img *ngIf="cardBackPreview()" [src]="cardBackPreview()!" [alt]="t('deck.cardBackPreviewAlt')" />
            <img *ngIf="!cardBackPreview() && currentBackUrl()" [src]="currentBackUrl()!" [alt]="t('deck.currentCardBackAlt')" />
            <div *ngIf="!cardBackPreview() && !currentBackUrl()"
                 class="card-back-gradient"
                 [style.background]="getSelectedGradient()">
              <span>🎴</span>
            </div>
          </div>
          <div class="card-back-actions">
            <p class="card-back-status" *ngIf="cardBackPreview()">✓ {{ t('deck.cardBackNewSelected') }}</p>
            <label class="btn-secondary btn-file">
              📷 {{ (cardBackPreview() || currentBackUrl()) ? t('deck.replaceImage') : t('deck.uploadImage') }}
              <input type="file" accept="image/*" (change)="onCardBackSelected($event)" hidden />
            </label>
            <button type="button" class="btn-ghost" *ngIf="cardBackPreview()" (click)="removeCardBack()">✕ {{ t('deck.undo') }}</button>
          </div>
        </div>
      </div>

      <!-- Name -->
      <div class="form-field">
        <label class="form-label" for="deckName">{{ t('deck.nameLabel') }}</label>
        <input id="deckName"
               class="form-input"
               formControlName="name"
               [placeholder]="t('deck.namePlaceholder')"
               maxlength="200" />
      </div>

      <!-- Description -->
      <div class="form-field">
        <label class="form-label" for="deckDesc">{{ t('deck.descriptionLabel') }} <span>{{ t('deck.optionalLabel') }}</span></label>
        <textarea id="deckDesc"
                  class="form-textarea"
                  formControlName="description"
                  [placeholder]="t('deck.descriptionPlaceholder')"
                  maxlength="1000"
                  rows="3"></textarea>
      </div>

      <!-- Visibility -->
      <div class="form-field">
        <label class="form-label">{{ t('deck.visibilityLabel') }}</label>
        <div class="visibility-row">
          <button type="button" class="visibility-btn"
                  [class.visibility-btn--active]="!form.get('isPublic')!.value"
                  (click)="form.get('isPublic')!.setValue(false)">🔒 {{ t('deck.private') }}</button>
          <button type="button" class="visibility-btn"
                  [class.visibility-btn--active]="form.get('isPublic')!.value"
                  (click)="form.get('isPublic')!.setValue(true)">🌐 {{ t('deck.public') }}</button>
        </div>
      </div>

      <div *ngIf="error()" class="state-error">{{ error() }}</div>

      <button type="submit"
              class="btn-primary btn-full"
              [disabled]="form.invalid || submitting()">
        {{ submitting() ? t('deck.saving') : ('💾 ' + t('deck.saveChanges')) }}
      </button>

      <button type="button"
              class="btn-danger btn-full"
              [disabled]="deleting()"
              (click)="deleteDeck()">
        {{ deleting() ? t('deck.deleting') : ('🗑 ' + t('deck.deleteButton')) }}
      </button>
    </form>
  </main>
</div>
