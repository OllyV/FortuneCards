<ng-container *transloco="let t">
<navigation-bar></navigation-bar>

<main class="settings-page">
  <div class="settings-header">
    <button class="back-btn" (click)="goBack()">← {{ t('common.back') }}</button>
    <h1>{{ t('pages.accountSettingsPageTitle') }}</h1>
  </div>

  @if (auth.currentUser(); as user) {
    <section class="settings-section">
      <div class="settings-label">{{ t('pages.connectedAccountLabel') }}</div>
      <div class="settings-google-row">
        <span class="google-badge">{{ t('pages.connectedAccountBadge') }}</span>
        <span class="settings-email">{{ user.email }}</span>
      </div>
    </section>

    <section class="settings-section danger-zone">
      <div class="settings-label danger">{{ t('pages.dangerZoneLabel') }}</div>
      <p class="danger-desc">{{ t('pages.accountDeleteDesc') }}</p>
      <button class="delete-account-btn" (click)="deleteAccount()" [disabled]="deleting()">
        {{ deleting() ? t('pages.deletingButton') : t('pages.deleteAccountButton') }}
      </button>
    </section>
  }
</main>
</ng-container>
